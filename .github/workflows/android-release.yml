name: Android release

# Push a tag like android-v0.1.0 to build a signed APK and publish it as a
# GitHub Release. The "android-" prefix keeps app releases apart from any
# other tags in this repo.
on:
  push:
    tags: ["android-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like android-v1.2.3 (got $GITHUB_REF_NAME)"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 isn't set. Releases must be signed with the release key; see android/README.md."; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ORG_GRADLE_PROJECT_signingStoreFile=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          ORG_GRADLE_PROJECT_apiBaseUrl: ${{ vars.API_BASE_URL }}
          ORG_GRADLE_PROJECT_googleWebClientId: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          ORG_GRADLE_PROJECT_signingStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_signingKeyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Must increase with every release so Android accepts the update.
          ORG_GRADLE_PROJECT_versionCode: ${{ github.run_number }}
          ORG_GRADLE_PROJECT_versionName: ${{ env.VERSION }}
        run: |
          if [ -z "$ORG_GRADLE_PROJECT_apiBaseUrl" ] || [ -z "$ORG_GRADLE_PROJECT_googleWebClientId" ]; then
            echo "::error::Set the API_BASE_URL and GOOGLE_WEB_CLIENT_ID repository variables first; see android/README.md."; exit 1
          fi
          ./gradlew testDebugUnitTest assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/achievement-hub-$VERSION.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/achievement-hub-$VERSION.apk" \
            --title "Achievement Hub for Android $VERSION" \
            --generate-notes
